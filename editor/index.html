<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Data Editor</title>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-header: #333333;
            --text-main: #cccccc;
            --text-highlight: #ffffff;
            --border: #3e3e42;
            --accent: #0e639c;
            --accent-hover: #1177bb;
            --danger: #d16969;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-header);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            height: 40px;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-highlight);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar: File List */
        .sidebar {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 10px;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-header);
        }

        .file-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            flex: 1;
        }

        .file-item {
            padding: 8px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            user-select: none;
        }

        .file-item:hover {
            background-color: #2a2d2e;
        }

        .file-item.active {
            background-color: #37373d;
            color: var(--text-highlight);
            border-left: 3px solid var(--accent);
        }

        /* Middle Panel: Item List (for JSON Arrays/Objects) */
        .list-panel {
            width: 250px;
            background-color: var(--bg-dark);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .list-header {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-header);
        }

        .item-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            flex: 1;
        }

        .item-entry {
            padding: 6px 10px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d30;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-entry:hover {
            background-color: #2a2d2e;
        }

        .item-entry.active {
            background-color: #04395e;
            color: var(--text-highlight);
        }

        /* Editor Area */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        .editor-header {
            padding: 10px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .editor-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #9cdcfe;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 8px;
            background-color: #3c3c3c;
            border: 1px solid #3c3c3c;
            color: var(--text-main);
            border-radius: 3px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: 1px solid var(--accent);
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Code Editor (Textarea for JS files) */
        .code-editor {
            width: 100%;
            height: 100%;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 10px;
            box-sizing: border-box;
            white-space: pre;
            overflow: auto;
            resize: none;
        }

        .code-editor:focus {
            outline: none;
        }

        /* Buttons */
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.danger {
            background-color: var(--danger);
        }

        button.danger:hover {
            background-color: #e57373;
        }

        button.small {
            padding: 2px 8px;
            font-size: 0.8rem;
        }

        .save-btn {
            padding: 8px 16px;
            font-weight: bold;
        }

        /* Array/Object nested editor */
        .nested-box {
            border: 1px solid var(--border);
            padding: 10px;
            margin-bottom: 10px;
            background-color: #252526;
            border-radius: 4px;
        }

        .nested-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        /* Status message */
        .status-message {
            margin-left: 15px;
            font-size: 0.9rem;
            color: #4caf50;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status-message.show {
            opacity: 1;
        }
        .status-message.error {
            color: var(--danger);
        }

    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>RPG Data Editor</h1>
            <div>
                <span class="status-message" :class="{ show: statusMsg, error: isError }">{{ statusMsg }}</span>
                <button class="save-btn" @click="saveCurrentFile" :disabled="!currentFile">Save File</button>
            </div>
        </header>

        <div class="main-container">
            <!-- Sidebar: File List -->
            <div class="sidebar">
                <div class="sidebar-header">Data Files</div>
                <ul class="file-list">
                    <li v-for="file in files" :key="file"
                        class="file-item"
                        :class="{ active: currentFile === file }"
                        @click="loadFile(file)">
                        {{ file }}
                    </li>
                </ul>
            </div>

            <!-- Middle Panel: Items List (Only for JSON arrays/objects) -->
            <div class="list-panel" v-if="isJsonEditor">
                <div class="list-header">
                    <span>Entries ({{ getEntriesCount() }})</span>
                    <button class="small" @click="addNewEntry">+</button>
                </div>
                <ul class="item-list">
                    <li v-for="(item, index) in parsedData" :key="index"
                        class="item-entry"
                        :class="{ active: currentItemIndex === index }"
                        @click="selectItem(index)">
                        {{ getEntryLabel(item, index) }}
                    </li>
                </ul>
            </div>

            <!-- Editor Area -->
            <div class="editor-area">
                <div class="editor-header" v-if="currentFile">
                    <span>{{ currentFile }} {{ isJsonEditor && currentItemIndex !== null ? ' - Edit Entry' : '' }}</span>
                    <button v-if="isJsonEditor && currentItemIndex !== null" class="danger small" @click="deleteCurrentEntry">Delete Entry</button>
                </div>

                <!-- JS Code Editor -->
                <div class="editor-content" v-if="!isJsonEditor && currentFile" style="padding: 0;">
                    <textarea class="code-editor" v-model="rawData" spellcheck="false"></textarea>
                </div>

                <!-- JSON Form Editor -->
                <div class="editor-content" v-if="isJsonEditor && currentItemIndex !== null">
                    <div v-for="(val, key) in currentItem" :key="key" class="form-group">
                        <label>{{ key }}</label>

                        <!-- String / Number -->
                        <input v-if="typeof val === 'string' || typeof val === 'number'"
                               :type="typeof val === 'number' ? 'number' : 'text'"
                               v-model="currentItem[key]"
                               @input="markDirty">

                        <!-- Boolean -->
                        <select v-else-if="typeof val === 'boolean'" v-model="currentItem[key]" @change="markDirty">
                            <option :value="true">True</option>
                            <option :value="false">False</option>
                        </select>

                        <!-- Array or Object (Fallback to JSON string edit for now) -->
                        <div v-else class="nested-box">
                            <textarea :value="JSON.stringify(val, null, 2)"
                                      @input="updateNested(key, $event.target.value)"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div class="editor-content" v-if="!currentFile" style="display:flex; align-items:center; justify-content:center; color:#666;">
                    Select a file from the sidebar to start editing.
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    files: [],
                    currentFile: null,
                    rawData: '',
                    parsedData: null, // For JSON (Array or Object)
                    isObjectDict: false, // true if JSON is {} instead of []
                    objectKeys: [], // Keeps track of keys if it's a dict
                    currentItemIndex: null, // index in array or objectKeys

                    statusMsg: '',
                    isError: false,
                    isDirty: false
                }
            },
            computed: {
                isJsonEditor() {
                    return this.currentFile && this.currentFile.endsWith('.json') && this.parsedData !== null;
                },
                currentItem() {
                    if (this.parsedData === null || this.currentItemIndex === null) return null;
                    if (this.isObjectDict) {
                        const key = this.objectKeys[this.currentItemIndex];
                        return this.parsedData[key];
                    }
                    return this.parsedData[this.currentItemIndex];
                }
            },
            mounted() {
                this.fetchFiles();
            },
            methods: {
                showStatus(msg, error = false) {
                    this.statusMsg = msg;
                    this.isError = error;
                    setTimeout(() => {
                        this.statusMsg = '';
                    }, 3000);
                },
                markDirty() {
                    this.isDirty = true;
                },
                async fetchFiles() {
                    try {
                        const res = await fetch('/api/list');
                        this.files = await res.json();
                    } catch (e) {
                        console.error(e);
                        this.showStatus('Failed to load file list', true);
                    }
                },
                async loadFile(filename) {
                    if (this.isDirty && !confirm("You have unsaved changes. Discard?")) {
                        return;
                    }

                    this.currentFile = filename;
                    this.currentItemIndex = null;
                    this.parsedData = null;
                    this.isDirty = false;

                    try {
                        const res = await fetch(`/api/data/${filename}`);
                        const text = await res.text();
                        this.rawData = text;

                        if (filename.endsWith('.json')) {
                            this.parsedData = JSON.parse(text);
                            if (Array.isArray(this.parsedData)) {
                                this.isObjectDict = false;
                                this.objectKeys = [];
                            } else if (typeof this.parsedData === 'object' && this.parsedData !== null) {
                                this.isObjectDict = true;
                                this.objectKeys = Object.keys(this.parsedData);
                            }
                            if (this.getEntriesCount() > 0) {
                                this.selectItem(0);
                            }
                        }
                    } catch (e) {
                        console.error(e);
                        this.showStatus('Failed to load file', true);
                    }
                },
                async saveCurrentFile() {
                    if (!this.currentFile) return;

                    let dataToSave = this.rawData;

                    if (this.isJsonEditor) {
                        try {
                            // Format JSON nicely
                            dataToSave = JSON.stringify(this.parsedData, null, 2);
                        } catch(e) {
                            this.showStatus('Invalid JSON format', true);
                            return;
                        }
                    }

                    try {
                        const res = await fetch(`/api/data/${this.currentFile}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: dataToSave
                        });

                        if (res.ok) {
                            this.showStatus('Saved successfully!');
                            this.isDirty = false;

                            // Update rawData to match what we saved in case it was modified via form
                            if (this.isJsonEditor) {
                                this.rawData = dataToSave;
                            }
                        } else {
                            this.showStatus('Save failed', true);
                        }
                    } catch (e) {
                        console.error(e);
                        this.showStatus('Save error', true);
                    }
                },
                getEntriesCount() {
                    if (!this.parsedData) return 0;
                    return this.isObjectDict ? this.objectKeys.length : this.parsedData.length;
                },
                getEntryLabel(item, index) {
                    if (this.isObjectDict) {
                        const key = this.objectKeys[index];
                        return key;
                    }
                    // Try to find a good display name
                    return item.name || item.title || item.id || `Item ${index}`;
                },
                selectItem(index) {
                    this.currentItemIndex = index;
                },
                updateNested(key, valueStr) {
                    try {
                        const parsed = JSON.parse(valueStr);
                        this.currentItem[key] = parsed;
                        this.markDirty();
                    } catch(e) {
                        // Let them type invalid JSON temporarily, but don't commit it to model
                    }
                },
                addNewEntry() {
                    if (this.isObjectDict) {
                        const newKey = prompt("Enter ID/Key for new entry:");
                        if (!newKey) return;
                        if (this.parsedData[newKey]) {
                            alert("Key already exists!");
                            return;
                        }

                        // Try to copy structure from first item if it exists
                        let newObj = {};
                        if (this.objectKeys.length > 0) {
                            const template = this.parsedData[this.objectKeys[0]];
                            newObj = JSON.parse(JSON.stringify(template)); // deep copy
                            // Clear values
                            for (let k in newObj) {
                                if (typeof newObj[k] === 'string') newObj[k] = '';
                                if (typeof newObj[k] === 'number') newObj[k] = 0;
                            }
                        }

                        this.parsedData[newKey] = newObj;
                        this.objectKeys.push(newKey);
                        this.selectItem(this.objectKeys.length - 1);
                        this.markDirty();

                    } else {
                         // Array
                         let newObj = {};
                         if (this.parsedData.length > 0) {
                            const template = this.parsedData[0];
                            newObj = JSON.parse(JSON.stringify(template));
                            for (let k in newObj) {
                                if (typeof newObj[k] === 'string') newObj[k] = '';
                                if (typeof newObj[k] === 'number') newObj[k] = 0;
                            }
                         }
                         this.parsedData.push(newObj);
                         this.selectItem(this.parsedData.length - 1);
                         this.markDirty();
                    }
                },
                deleteCurrentEntry() {
                    if (!confirm("Are you sure you want to delete this entry?")) return;

                    if (this.isObjectDict) {
                        const key = this.objectKeys[this.currentItemIndex];
                        delete this.parsedData[key];
                        this.objectKeys.splice(this.currentItemIndex, 1);
                    } else {
                        this.parsedData.splice(this.currentItemIndex, 1);
                    }

                    this.currentItemIndex = null;
                    if (this.getEntriesCount() > 0) {
                        this.selectItem(0);
                    }
                    this.markDirty();
                }
            }
        }).mount('#app')
    </script>
</body>
</html>

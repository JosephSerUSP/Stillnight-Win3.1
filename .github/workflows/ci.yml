name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-harness:
    name: Lint and deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source boundaries
        run: npm run lint

      - name: Verify deterministic golden logs
        run: npm run harness

      - name: Verify battle selectors
        run: node tests/test_battle_selector.js

      - name: Verify effect contract
        run: node tests/test_effect_system.js

      - name: Verify Summoner resource contract
        run: node tests/test_summoner_resource.js

      - name: Verify Summoner spell contract
        run: node tests/test_summoner_spells.js

  browser:
    name: Playwright browser regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        shell: bash
        run: |
          npx http-server . -p 8080 -c-1 > /tmp/stillnight-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/ > /dev/null
          npm test
